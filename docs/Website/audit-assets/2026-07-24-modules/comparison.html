<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FlowIQ Modules Directory — Before and After</title>
  <style>
    * { box-sizing: border-box; }

    header span { color: #c9c0b8; font-size: .75rem; }

<body>
  <header><strong>FlowIQ Modules Directory</strong><span>Same 1280px desktop review width</span></header>
  <main>
    <figure><figcaption>Before — limited directory and anchor dead-ends</figcaption><img src="./01-current-modules-directory.png" alt="Previous FlowIQ modules directory"></figure>
    <figure><figcaption>After — 32 searchable capabilities and dedicated pages</figcaption><img src="./02-premium-modules-directory.png" alt="New FlowIQ premium modules directory"></figure>
